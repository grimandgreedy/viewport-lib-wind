[package]
name = "viewport-lib-wind"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Wind field plugin for viewport-lib: per-vertex displacement, CPU sampler, runtime + GPU plugins"
readme = "README.md"
license = "GPL-3.0-only"
repository = "https://github.com/grimandgreedy/viewport-lib-wind"
homepage = "https://github.com/grimandgreedy/viewport-lib-wind"
documentation = "https://docs.rs/viewport-lib-wind"
keywords = ["3d", "wind", "vertex", "viewport", "viewport-lib"]
categories = ["graphics", "rendering"]
publish = true
exclude = ["/assets/"]

[dependencies]
viewport-lib = { version = "0.23" }
glam = { version = "=0.30.10", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "27.0"
# Sprite and tile sway, behind the `2d` feature.
viewport-lib-plugins = { version = "0.1", default-features = false, features = ["wgpu27", "item-types"], optional = true }

[features]
# Sway for viewport-lib's sprites and tile layers.
2d = ["dep:viewport-lib-plugins"]

[dev-dependencies]
pollster = "0.4"
# The meadow example runs on ViewportApp.
viewport-lib = { version = "0.23", features = ["app"] }
# Loads the meadow models and their textures.
viewport-lib-io = { version = "0.9", default-features = false, features = ["gltf", "png"] }

[[example]]
name = "wind-minimal"
path = "examples/wind_minimal.rs"

[[example]]
name = "wind-meadow"
path = "examples/wind_meadow/main.rs"
